<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2451D6">
<meta name="apple-mobile-web-app-title" content="Liftwise">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Liftwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F3F5F8; --surface-3:#E6EAF0;
  --ink:#131820; --ink-2:#465061; --ink-3:#778293; --line:#DCE1E8;
  --accent:#2451D6; --accent-ink:#FFFFFF; --accent-soft:#E4EBFD; --accent-line:#BFD0F8;
  --fresh:#17936A; --mid:#D08C0B; --tired:#CF3F28; --body:#D3D9E1;
  --bar:#131820; --bar-ink:#F4F6F9; --scrim:rgba(12,16,22,.45);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --tabh:64px; --seg-on:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#161B22; --surface-2:#1D232C; --surface-3:#262D38;
    --ink:#EEF1F5; --ink-2:#AAB3C0; --ink-3:#76808E; --line:#29303A;
    --accent:#7093FF; --accent-ink:#0A0F1C; --accent-soft:#1B2542; --accent-line:#34467A;
    --fresh:#3CC495; --mid:#F0B03A; --tired:#F2694F; --body:#2C333E;
    --bar:#EEF1F5; --bar-ink:#0D1015; --scrim:rgba(0,0,0,.6); --seg-on:#38414F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161B22; --surface-2:#1D232C; --surface-3:#262D38;
  --ink:#EEF1F5; --ink-2:#AAB3C0; --ink-3:#76808E; --line:#29303A;
  --accent:#7093FF; --accent-ink:#0A0F1C; --accent-soft:#1B2542; --accent-line:#34467A;
  --fresh:#3CC495; --mid:#F0B03A; --tired:#F2694F; --body:#2C333E;
  --bar:#EEF1F5; --bar-ink:#0D1015; --scrim:rgba(0,0,0,.6); --seg-on:#38414F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--tabh) + 110px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
h1,h2,h3{margin:0;text-wrap:balance}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:6px 16px}
.page-h h1{font-size:44px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:active{background:var(--surface-3)}
.icon-btn svg{width:22px;height:22px}

/* hero */
.hero{padding-block:4px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h1{font-size:clamp(56px,16vw,84px);margin-block:6px 2px}
.hero h1 small{font-size:.42em;color:var(--ink-3);font-weight:700;margin-left:.15em;letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.focus-row{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:14px 16px 2px;scrollbar-width:none}
.focus-row::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{height:50px;border-radius:13px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.btn-primary{flex:1;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.btn-primary:active{filter:brightness(.92)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-ghost svg{width:20px;height:20px}
.btn-danger{color:var(--tired)}
.btn-block{width:100%}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13px;color:var(--ink-2)}

/* exercise cards */
.ex-list{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px}
.ex.complete{border-color:var(--accent-line)}
.ex-head{display:flex;gap:10px;align-items:flex-start;padding-inline:4px}
.ex-idx{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--ink-3);width:22px;flex:none;padding-top:1px}
.ex.complete .ex-idx{color:var(--accent)}
.ex-title{flex:1;min-width:0}
.ex-title h3{font-size:16.5px;font-weight:700;line-height:1.25}
.ex-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.ex-sub b{color:var(--ink-2);font-weight:600}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;border-radius:12px;padding:3px 4px}
.set-row.head{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-block:0}
.set-row.head span{text-align:center}
.set-row.head span:first-child{text-align:left}
.set-row.done{background:var(--accent-soft)}
.set-n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink-2);text-align:center}
.set-row.warm .set-n{color:var(--mid);font-size:17px}
.stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;background:var(--surface-2);border-radius:11px;height:44px}
.set-row.done .stepper{background:transparent}
.stepper button{height:44px;font-size:20px;color:var(--ink-3);font-weight:500}
.stepper button:active{color:var(--accent)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;height:44px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{color:var(--ink-3);font-weight:600}
.check{width:46px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.check svg{width:22px;height:22px}
.set-row.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;padding:0 4px;min-height:32px}
.plates{font-size:12.5px;color:var(--ink-3)}
.plates b{color:var(--ink-2);font-weight:600}
.link-btn{font-size:13.5px;font-weight:600;color:var(--accent);padding:6px 2px}
.list-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}

/* rest bar */
#rest{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);z-index:30;padding-inline:12px;pointer-events:none}
.rest-card{pointer-events:auto;max-width:536px;margin:0 auto;background:var(--bar);color:var(--bar-ink);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rest-fill{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
.rest-time{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;min-width:74px;font-variant-numeric:tabular-nums}
.rest-card .sp{flex:1}
.rest-card button{height:38px;padding:0 12px;border-radius:10px;background:rgba(127,127,127,.22);font-weight:600;font-size:14px;color:inherit}
.rest-card.over .rest-time{color:var(--accent)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.progress i{transition:none}}
.sheet-h{padding:10px 16px 8px;display:flex;align-items:center;gap:8px}
.sheet-h::before{content:"";position:absolute}
.grab{width:40px;height:5px;border-radius:9px;background:var(--surface-3);margin:8px auto 0}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;flex:1;line-height:1}
.sheet-b{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:16px}
.menu button:last-child{border-bottom:0}
.menu button svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.menu .danger{color:var(--tired)}
.menu .danger svg{color:var(--tired)}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-block:10px}
.chips .fchip{height:30px;font-size:13px;padding:0 11px}
.pick{display:flex;flex-direction:column}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left}
.pick .nm{font-weight:600;font-size:15.5px}
.pick .sub{font-size:12.5px;color:var(--ink-3)}
.pick .tag{font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:3px 7px;flex:none}
.group-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}

/* settings */
.field{margin-block:0 18px}
.field > label,.field > .lbl{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;height:38px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.sync{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--surface-2)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:4px}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.pr-badge{font-family:var(--display);font-weight:800;font-size:14px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 7px;letter-spacing:.05em}

/* recovery */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 8px 8px}
.bodymap figure{margin:0;text-align:center}
.bodymap svg{width:100%;max-width:170px;height:auto}
.bodymap figcaption{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.bodymap [data-m]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:10px 2px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rec-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.rec-row:last-child{border-bottom:0}
.rec-row .nm{font-weight:600}
.rec-row .pct{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;line-height:1}
.rec-row .when{font-size:12px;color:var(--ink-3);grid-column:1/-1;margin-top:-2px}
.meter{grid-column:1/-1;height:6px;background:var(--surface-3);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}
.rec-row.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* history */
.month{margin-block:18px 8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.hcard > button{display:flex;width:100%;text-align:left;gap:12px;padding:12px 14px;align-items:center}
.hdate{width:44px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.hdate .d{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.hdate .w{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.hmain{flex:1;min-width:0}
.hmain .f{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.hmain .s{font-size:13px;color:var(--ink-3)}
.hdetail{padding:0 14px 12px;border-top:1px solid var(--line)}
.hex{padding:10px 0 2px}
.hex .nm{font-weight:600;font-size:14.5px}
.hex .sets-t{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty .display{font-size:30px;color:var(--ink-2);margin-bottom:8px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:4px;line-height:1.25}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.panel h2{font-size:15px;font-weight:700}
.panel .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--bar);color:var(--bar-ink);font-size:12px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums;line-height:1.35}
.tip b{font-weight:700}
select.picker{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:15px;font-weight:600;margin-top:10px}
.bests{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.bests b{color:var(--ink);font-weight:700}

/* week goal */
.topbar{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 8px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.week.won{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week.won .eyebrow,.week.won .streak .k,.week.won .week-count .lbl,.week.won .week-count .of,.week.won .week-msg,.week.won .day .dl{color:inherit;opacity:.85}
.week-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.week-count{display:flex;align-items:baseline;gap:2px;margin-top:6px}
.week-count .display{font-size:68px;line-height:.82}
.week-count .of{font-size:34px;color:var(--ink-3)}
.week-count .lbl{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:8px}
.streak{text-align:right;flex:none}
.streak .display{font-size:44px;line-height:.9}
.streak .k{font-size:12px;font-weight:600;color:var(--ink-3)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.day .dl{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.day i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;border:2px solid transparent}
.day.today i{border-color:var(--ink-3)}
.day.future i{opacity:.5}
.day.hit i{background:var(--accent);color:var(--accent-ink)}
.day i svg{width:58%;height:58%}
.week.won .day i{background:rgba(255,255,255,.2)}
.week.won .day.hit i{background:var(--accent-ink);color:var(--accent)}
.week.won .day.today i{border-color:currentColor}
.week-msg{margin-top:14px;font-size:14px;font-weight:600;color:var(--ink-2)}
.lstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lstat .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.lstat .v small{font-size:15px;font-weight:700;color:var(--ink-3);font-family:var(--sans)}

    case 'addset': addSet(u); break;
    case 'rt': { const w = ensureActive(); const x = w[t.dataset.k] && w[t.dataset.k][+t.dataset.i]; if (x) { x.done = !x.done; if (x.done && !w.startedAt && t.dataset.k === 'warmup') { w.startedAt = Date.now(); requestWake(); } Store.saveActive(); render(true); } break; }
    case 'exmenu': openSheet({ kind: 'menu', u }); break;
    case 'exinfo': openSheet({ kind: 'exinfo', ex: t.dataset.ex }); break;
    case 'addex': openSheet({ kind: 'pick', mode: 'add' }); break;
    case 'rest-add': if (state.rest) { state.rest.end += +t.dataset.d * 1000; state.rest.total = Math.max(15, state.rest.total + +t.dataset.d); state.rest.over = false; if (state.rest.end <= Date.now()) stopRest(); else tickRest(); } break;
    case 'rest-skip': stopRest(); break;
    case 'sore': openSheet({ kind: 'sore', m: t.dataset.m }); break;
    case 'sore-set': {
      const m = sheet.m; const v = t.dataset.v;
      state.soreness = state.soreness.filter(s => s.m !== m);
      if (v === 'sore') state.soreness.push({ m, f: 60, at: Date.now() });
      if (v === 'fresh') state.soreness.push({ m, reset: true, at: Date.now() });
      save(); state.plan = null; if (state.active && !anyDone(state.active) && !state.active.startedAt) state.active = null;
      closeSheet(); render(true); toast(v === 'sore' ? MUSCLE[m].name + ' marked sore — it gets a rest' : v === 'fresh' ? MUSCLE[m].name + ' marked fresh' : 'Back to normal'); break;
    }
    case 'hist': state.openHist = state.openHist === t.dataset.id ? null : t.dataset.id; render(true); break;
    case 'hist-del': { const id = t.dataset.id; confirmSheet('Delete this workout?', 'It comes off your history, charts and recovery here.', 'Delete', () => {
      if (id.startsWith('hk')) { state.hk = state.hk || { at: 0, n: 0, hidden: [] }; state.hk.hidden = (state.hk.hidden || []).concat([id]); saveHK(); }
      state.workouts = state.workouts.filter(w => w.id !== id); save(); state.plan = null; render(true); }); break; }
    case 'sheet-close': closeSheet(); break;
    case 'confirm-yes': { const fn = sheet && sheet.fn; closeSheet(); fn && fn(); break; }
    case 'm-swap': { const { it } = findIt(sheet.u); if (it && it.sets.some(s => s.done)) { closeSheet(); toast('Sets are logged on this one. Add a new exercise instead.'); } else openSheet({ kind: 'pick', mode: 'swap', u: sheet.u }); break; }
    case 'm-info': { const { it } = findIt(sheet.u); if (it) openSheet({ kind: 'exinfo', ex: it.exId }); break; }
    case 'm-addset': { const x = sheet.u; closeSheet(); addSet(x); break; }
    case 'm-rmset': { const w = ensureActive(); const it = w.exercises.find(x => x.uid === sheet.u); if (it && it.sets.length > 1) it.sets.pop(); closeSheet(); Store.saveActive(); render(true); break; }
    case 'm-up': case 'm-down': { const w = ensureActive(); const i = w.exercises.findIndex(x => x.uid === sheet.u); const k = act === 'm-up' ? i - 1 : i + 1; if (i >= 0 && k >= 0 && k < w.exercises.length) { const tmp = w.exercises[i]; w.exercises[i] = w.exercises[k]; w.exercises[k] = tmp; } closeSheet(); Store.saveActive(); render(true); break; }
    case 'm-ban': { const { it } = findIt(sheet.u); if (it && !state.excluded.includes(it.exId)) { state.excluded.push(it.exId); save(); } closeSheet(); toast('Won’t suggest it again. Bring it back in Settings.'); if (it && !it.sets.some(s => s.done)) openSheet({ kind: 'pick', mode: 'swap', u: it.uid }); break; }
    case 'm-remove': { const w = ensureActive(); const it = w.exercises.find(x => x.uid === sheet.u); if (it) learn(it.exId, 'out'); w.exercises = w.exercises.filter(x => x.uid !== sheet.u); closeSheet(); save(); render(true); break; }
    case 'pick-m': sheet.m = t.dataset.m; paintSheet(); break;
    case 'pick': {
      const ex = EX[t.dataset.ex]; if (!ex) break; const w = ensureActive();
      if (sheet.mode === 'swap') {
        const i = w.exercises.findIndex(x => x.uid === sheet.u);
        if (i >= 0) { learn(w.exercises[i].exId, 'out'); const nu = prescribe(ex, i === 0 ? 'main' : 'other', state.settings, history()); nu.ss = w.exercises[i].ss; w.exercises[i] = nu; }
      } else w.exercises.push(prescribe(ex, 'other', state.settings, history()));
      learn(ex.id, 'add'); closeSheet(); save(); render(true);
      break;
    }
    case 'pref': setPref(t.dataset.ex, t.dataset.v); break;
    case 'set': changeSetting(t.dataset.k, t.dataset.v); break;
    case 'toggle-set': changeSetting(t.dataset.k, !state.settings[t.dataset.k]); break;
    case 'gym': state.settings.gym = t.dataset.v; state.settings.gear = (GYMS[t.dataset.v] || GYMS.fc).gear.slice(); afterSettingChange('gym'); break;
    case 'gear': { const g = t.dataset.g; const S = state.settings; S.gear = S.gear.includes(g) ? S.gear.filter(x => x !== g) : S.gear.concat([g]); S.gym = 'custom'; afterSettingChange('gear'); break; }
    case 'backup': backup(); break;
    case 'wipe': confirmSheet('Delete all history?', 'Every logged workout comes off this phone. Apple Health keeps its own copy of your walks. This can’t be undone.', 'Delete all', () => {
      state.hk = state.hk || { at: 0, n: 0, hidden: [] }; state.hk.hidden = (state.hk.hidden || []).concat(state.workouts.filter(w => w.src === 'health').map(w => w.id)); saveHK();
      state.workouts = []; save(); state.plan = null; render(true); toast('History cleared');
    }); break;
  }
});
document.addEventListener('change', e => {
  const inp = e.target;
  if (inp.tagName === 'INPUT' && inp.dataset.t) {
    const f = inp.dataset.t; const v = parseFloat(inp.value.trim().replace(',', '.'));
    if (isNaN(v)) { inp.value = fmtT(f, tread()[f]); return; }
    setTread(f, v); inp.value = fmtT(f, tread()[f]); return;
  }
  if (!(inp.tagName === 'INPUT' && inp.dataset.f && inp.closest('#view'))) return;
  const card = inp.closest('.ex'); const row = inp.closest('.set-row'); if (!card || !row) return;
  const u = card.dataset.u, j = +row.dataset.i, f = inp.dataset.f;
  const raw = inp.value.trim().replace(',', '.');
  const { it } = findIt(u); if (!it) return;
  const v = raw === '' ? 0 : parseFloat(raw);
  if (isNaN(v)) { const s = it.sets[j]; inp.value = f === 'w' ? fmtW(s.w) : String(s.r); return; }
  setVal(u, j, f, v);
});
document.addEventListener('focusin', e => { const t = e.target; if (t.tagName === 'INPUT' && (t.dataset.f || t.dataset.t)) setTimeout(() => { try { t.select(); } catch (x) { } }, 0); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && (e.target.dataset.f || e.target.dataset.t)) e.target.blur();
  if (e.key === 'Escape' && sheet) closeSheet();
});
window.addEventListener('hashchange', () => { readHealthFromURL(); });

/* swipe the week card left/right to move between weeks */
let swX = null, swY = null;
document.addEventListener('touchstart', e => { const c = e.target.closest && e.target.closest('.week'); if (!c) { swX = null; return; } const t = e.touches[0]; swX = t.clientX; swY = t.clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (swX == null) return; const t = e.changedTouches[0]; const dx = t.clientX - swX, dy = t.clientY - swY; swX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { const next = Math.min(0, (state.weekOff || 0) + (dx > 0 ? -1 : 1)); if (next !== state.weekOff) { state.weekOff = next; render(true); } }
}, { passive: true });

/* ---------- start ---------- */
load();
if (state.active && state.active.startedAt) state.mode = 'lift';
render(true);
readHealthFromURL();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
})();
</script>
